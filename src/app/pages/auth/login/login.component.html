<section class="p-1 mt-0 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md p-6 bg-[#4B2E18] shadow-lg rounded-lg">
    <form (submit)="login(); $event.preventDefault()" class="space-y-6">
      <div class="flex justify-center">
        <img src="imgs/Logo_Faty.png" width="150" height="150" alt="Logo">
      </div>

      <div>
        <label for="email" class="block text-white font-semibold mb-1">Email:</label>
        <div class="flex items-center bg-white rounded-md overflow-hidden shadow-inner">
          <span class="px-3 text-[#FF6A00] font-bold">{{"@"}}</span>
          <input type="email" id="email" name="email" [(ngModel)]="email"
            class="w-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#FF6A00]" />
        </div>
      </div>

      <div>
        <label for="password" class="block text-white font-semibold mb-1">Contraseña:</label>
        <input type="password" id="password" name="password" [(ngModel)]="password"
          class="w-full px-4 py-2 rounded-md shadow-inner focus:outline-none focus:ring-2 focus:ring-[#FF3CAC]" />
      </div>

      <div class="text-center">
        <button type="submit"
          class="px-6 py-2 rounded-full font-bold bg-[#FF6A00] text-white hover:bg-[#FF3CAC] transition-colors duration-300">
          Iniciar sesión
        </button>
      </div>
    </form>

     <p class="mt-4 text-center text-white">
      ¿No tienes cuenta? 
      <a href="/register" class="text-[#FF6A00] hover:text-[#FF3CAC] font-bold">¡Registrate aqui!</a>
    </p>
  </div>
</section>
