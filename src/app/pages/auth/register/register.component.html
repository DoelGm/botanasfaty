<section class="p-1 mt-0 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md p-6 bg-[#4B2E18] shadow-lg rounded-lg">

    <!-- Alerta general de error -->
    <div *ngIf="generalError" class="mb-4 p-3 bg-red-600 text-white rounded">
      {{ generalError }}
    </div>

    <!-- Alerta general de éxito -->
    <div *ngIf="generalSuccess" class="mb-4 p-3 bg-green-600 text-white rounded">
      {{ generalSuccess }}
    </div> 
      <!-- Logo -->
      <div class="flex justify-center">
        <img src="imgs/Logo_Faty.png" width="150" height="150" alt="Logo">
      </div>

      <form (submit)="onRegister(); $event.preventDefault()" class="space-y-6">


      <!-- Nombre -->
      <div>
        <label for="name" class="block text-white font-semibold mb-1">Nombre:</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          [(ngModel)]="name"
          class="w-full px-4 py-2 rounded-md shadow-inner focus:outline-none focus:ring-2 focus:ring-[#FF6A00]" 
          required
        />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-white font-semibold mb-1">Email:</label>
        <div class="flex items-center bg-white rounded-md overflow-hidden shadow-inner">
          <span class="px-3 text-[#FF6A00] font-bold">{{"@"}}</span>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="email"
            class="w-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#FF6A00]" 
            required
          />
        </div>
      </div>

      <!-- Contraseña -->
      <div>
        <label for="password" class="block text-white font-semibold mb-1">Contraseña:</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password"
          class="w-full px-4 py-2 rounded-md shadow-inner focus:outline-none focus:ring-2 focus:ring-[#FF3CAC]" 
          required
        />
      </div>

      <!-- Confirmar contraseña -->
      <div>
        <label for="password_confirmation" class="block text-white font-semibold mb-1">Confirmar Contraseña:</label>
        <input 
          type="password" 
          id="password_confirmation" 
          name="password_confirmation" 
          [(ngModel)]="password_confirmation"
          class="w-full px-4 py-2 rounded-md shadow-inner focus:outline-none focus:ring-2 focus:ring-[#FF3CAC]" 
          required
        />
      </div>

      <!-- Botón -->
      <div class="text-center">
        <button 
          type="submit"
          class="px-6 py-2 rounded-full font-bold bg-[#FF6A00] text-white hover:bg-[#FF3CAC] transition-colors duration-300">
          Registrarse
        </button>
      </div>
    </form>

    <!-- Link para ir al login -->
    <p class="mt-4 text-center text-white">
      ¿Ya tienes cuenta? 
      <a href="/login" class="text-[#FF6A00] hover:text-[#FF3CAC] font-bold">Inicia sesión aquí</a>
    </p>
  </div>
</section>
